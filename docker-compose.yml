version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thoth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thoth_secret}
      POSTGRES_DB: ${POSTGRES_DB:-thoth_museum}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./web-app/backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./web-app/backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./web-app/backend:/app

  frontend:
    build: ./web-app/frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./web-app/frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
