<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15243B"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B0892F"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="900" fill="#F4EFE0"/>

  <!-- title -->
  <text x="70" y="76" font-size="40" font-weight="bold" fill="#15243B">ROS&#160;2 — Node &amp; Topic Graph</text>
  <line x1="70" y1="92" x2="560" y2="92" stroke="#C9A24B" stroke-width="3"/>
  <text x="70" y="122" font-size="17" font-style="italic" fill="#6B6759" font-family="Helvetica, Arial, sans-serif">Runtime communication: sensing &#8594; Nav2 navigation &#8594; web-app docent stack</text>

  <!-- legend (top-right) -->
  <rect x="1186" y="44" width="38" height="20" rx="10" fill="#FBF9F1" stroke="#15243B" stroke-width="2"/>
  <text x="1234" y="59" font-size="15" fill="#15243B" font-family="Helvetica, Arial, sans-serif">ROS node</text>
  <rect x="1186" y="76" width="38" height="20" rx="3" fill="#EAE2CC" stroke="#C9A24B" stroke-width="2"/>
  <text x="1234" y="91" font-size="15" fill="#15243B" font-family="Helvetica, Arial, sans-serif">Process group</text>
  <line x1="1188" y1="118" x2="1222" y2="118" stroke="#B0892F" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <text x="1234" y="123" font-size="15" fill="#15243B" font-family="Helvetica, Arial, sans-serif">Topic (pub &#8594; sub)</text>

  <!-- ===================== SENSORS ===================== -->
  <!-- LiDAR -->
  <rect x="140" y="170" width="180" height="56" rx="28" fill="#15243B"/>
  <text x="230" y="204" font-size="19" font-weight="bold" fill="#F4EFE0" text-anchor="middle">LiDAR Driver</text>
  <!-- Camera -->
  <rect x="860" y="167" width="180" height="56" rx="28" fill="#15243B"/>
  <text x="950" y="201" font-size="19" font-weight="bold" fill="#F4EFE0" text-anchor="middle">Camera</text>

  <!-- ===================== NAV2 STACK ===================== -->
  <rect x="120" y="300" width="430" height="320" rx="16" fill="#EAE2CC" stroke="#C9A24B" stroke-width="2"/>
  <text x="142" y="338" font-size="23" font-weight="bold" fill="#B0892F">Nav2 Stack</text>
  <!-- modules -->
  <rect x="150" y="360" width="180" height="60" rx="10" fill="#FBF9F1" stroke="#C9A24B" stroke-width="1.5"/>
  <text x="240" y="397" font-size="18" font-weight="bold" fill="#15243B" text-anchor="middle">AMCL</text>
  <rect x="350" y="360" width="180" height="60" rx="10" fill="#FBF9F1" stroke="#C9A24B" stroke-width="1.5"/>
  <text x="440" y="397" font-size="18" font-weight="bold" fill="#15243B" text-anchor="middle">Map Server</text>
  <rect x="150" y="470" width="180" height="60" rx="10" fill="#FBF9F1" stroke="#C9A24B" stroke-width="1.5"/>
  <text x="240" y="500" font-size="16" font-weight="bold" fill="#15243B" text-anchor="middle">Planner +</text>
  <text x="240" y="519" font-size="16" font-weight="bold" fill="#15243B" text-anchor="middle">Controller</text>
  <rect x="350" y="470" width="180" height="60" rx="10" fill="#FBF9F1" stroke="#C9A24B" stroke-width="1.5"/>
  <text x="440" y="506" font-size="17" font-weight="bold" fill="#15243B" text-anchor="middle">BT Navigator</text>

  <!-- ===================== ACTUATION ===================== -->
  <rect x="150" y="690" width="160" height="54" rx="27" fill="#FBF9F1" stroke="#15243B" stroke-width="2"/>
  <text x="230" y="723" font-size="17" font-weight="bold" fill="#15243B" text-anchor="middle">Serial Node</text>
  <rect x="130" y="800" width="200" height="54" rx="12" fill="#15243B"/>
  <text x="230" y="833" font-size="16" font-weight="bold" fill="#F4EFE0" text-anchor="middle">Arduino + Motors</text>

  <!-- ===================== PERCEPTION ===================== -->
  <rect x="745" y="293" width="150" height="54" rx="27" fill="#FBF9F1" stroke="#15243B" stroke-width="2"/>
  <text x="820" y="326" font-size="17" font-weight="bold" fill="#15243B" text-anchor="middle">Age Node</text>
  <rect x="1005" y="293" width="150" height="54" rx="27" fill="#FBF9F1" stroke="#15243B" stroke-width="2"/>
  <text x="1080" y="326" font-size="17" font-weight="bold" fill="#15243B" text-anchor="middle">Mood Node</text>

  <!-- ===================== DOCENT STACK ===================== -->
  <rect x="660" y="420" width="800" height="400" rx="16" fill="#EAE2CC" stroke="#C9A24B" stroke-width="2"/>
  <text x="682" y="458" font-size="23" font-weight="bold" fill="#B0892F">Docent Stack</text>
  <!-- web app (highlighted hub) -->
  <rect x="685" y="480" width="280" height="78" rx="10" fill="#15243B" stroke="#C9A24B" stroke-width="2"/>
  <text x="825" y="513" font-size="19" font-weight="bold" fill="#F4EFE0" text-anchor="middle">Web App + LLM</text>
  <text x="825" y="537" font-size="13" fill="#C9A24B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">FastAPI · React · Gemini</text>
  <!-- tour coordinator -->
  <rect x="1170" y="480" width="260" height="78" rx="10" fill="#FBF9F1" stroke="#C9A24B" stroke-width="1.5"/>
  <text x="1300" y="525" font-size="18" font-weight="bold" fill="#15243B" text-anchor="middle">Tour Coordinator</text>
  <!-- prompt builder -->
  <rect x="685" y="650" width="300" height="90" rx="10" fill="#FBF9F1" stroke="#C9A24B" stroke-width="1.5"/>
  <text x="835" y="688" font-size="18" font-weight="bold" fill="#15243B" text-anchor="middle">Prompt Builder</text>
  <text x="835" y="714" font-size="14" font-style="italic" fill="#B0892F" text-anchor="middle">"age + mood + exhibit"</text>
  <!-- database -->
  <rect x="1170" y="650" width="260" height="90" rx="10" fill="#FBF9F1" stroke="#C9A24B" stroke-width="1.5"/>
  <text x="1300" y="688" font-size="17" font-weight="bold" fill="#15243B" text-anchor="middle">Database /</text>
  <text x="1300" y="710" font-size="17" font-weight="bold" fill="#15243B" text-anchor="middle">Exhibit Loader</text>

  <!-- inner docent arrows -->
  <line x1="965" y1="519" x2="1170" y2="519" stroke="#15243B" stroke-width="2.5" marker-end="url(#arrowNavy)"/>
  <line x1="1170" y1="695" x2="987" y2="695" stroke="#15243B" stroke-width="2.5" marker-end="url(#arrowNavy)"/>
  <line x1="835" y1="650" x2="835" y2="560" stroke="#15243B" stroke-width="2.5" marker-end="url(#arrowNavy)"/>

  <!-- ===================== TOPIC EDGES ===================== -->
  <!-- LiDAR -> Nav2 : /scan -->
  <line x1="230" y1="226" x2="230" y2="300" stroke="#15243B" stroke-width="2.5" marker-end="url(#arrowNavy)"/>
  <rect x="244" y="248" width="58" height="24" rx="6" fill="#F4EFE0"/>
  <text x="250" y="265" font-size="16" font-style="italic" fill="#9A7B2E">/scan</text>

  <!-- Nav2 -> Serial : /cmd_vel -->
  <line x1="230" y1="620" x2="230" y2="690" stroke="#15243B" stroke-width="2.5" marker-end="url(#arrowNavy)"/>
  <rect x="244" y="643" width="82" height="24" rx="6" fill="#F4EFE0"/>
  <text x="250" y="660" font-size="16" font-style="italic" fill="#9A7B2E">/cmd_vel</text>

  <!-- Serial -> Arduino -->
  <line x1="230" y1="744" x2="230" y2="800" stroke="#15243B" stroke-width="2.5" marker-end="url(#arrowNavy)"/>
  <rect x="244" y="760" width="56" height="22" rx="6" fill="#F4EFE0"/>
  <text x="250" y="776" font-size="14" font-style="italic" fill="#6B6759">serial</text>

  <!-- Camera -> Age/Mood : /image_raw -->
  <line x1="950" y1="223" x2="950" y2="262" stroke="#15243B" stroke-width="2.5"/>
  <line x1="820" y1="262" x2="1080" y2="262" stroke="#15243B" stroke-width="2.5"/>
  <line x1="820" y1="262" x2="820" y2="293" stroke="#15243B" stroke-width="2.5" marker-end="url(#arrowNavy)"/>
  <line x1="1080" y1="262" x2="1080" y2="293" stroke="#15243B" stroke-width="2.5" marker-end="url(#arrowNavy)"/>
  <rect x="906" y="232" width="92" height="24" rx="6" fill="#F4EFE0"/>
  <text x="912" y="249" font-size="16" font-style="italic" fill="#9A7B2E">/image_raw</text>

  <!-- Age -> Docent : /age -->
  <line x1="820" y1="347" x2="820" y2="420" stroke="#15243B" stroke-width="2.5" marker-end="url(#arrowNavy)"/>
  <rect x="834" y="372" width="48" height="24" rx="6" fill="#F4EFE0"/>
  <text x="840" y="389" font-size="16" font-style="italic" fill="#9A7B2E">/age</text>

  <!-- Mood -> Docent : /mood -->
  <line x1="1080" y1="347" x2="1080" y2="420" stroke="#15243B" stroke-width="2.5" marker-end="url(#arrowNavy)"/>
  <rect x="1094" y="372" width="62" height="24" rx="6" fill="#F4EFE0"/>
  <text x="1100" y="389" font-size="16" font-style="italic" fill="#9A7B2E">/mood</text>

  <!-- Nav2 <-> Docent integration (gold) -->
  <!-- /amcl_pose : Nav2 -> Docent -->
  <line x1="550" y1="468" x2="660" y2="468" stroke="#B0892F" stroke-width="3" marker-end="url(#arrowGold)"/>
  <rect x="558" y="438" width="96" height="24" rx="6" fill="#F4EFE0"/>
  <text x="606" y="455" font-size="16" font-style="italic" font-weight="bold" fill="#9A7B2E" text-anchor="middle">/amcl_pose</text>
  <!-- /goal_pose : Docent -> Nav2 -->
  <line x1="660" y1="558" x2="550" y2="558" stroke="#B0892F" stroke-width="3" marker-end="url(#arrowGold)"/>
  <rect x="560" y="566" width="92" height="24" rx="6" fill="#F4EFE0"/>
  <text x="606" y="583" font-size="16" font-style="italic" font-weight="bold" fill="#9A7B2E" text-anchor="middle">/goal_pose</text>

  <!-- footer -->
  <line x1="70" y1="868" x2="1530" y2="868" stroke="#C9A24B" stroke-width="1"/>
  <text x="70" y="890" font-size="13" letter-spacing="3" fill="#B0892F" font-family="Helvetica, Arial, sans-serif">THOTH — SMART MUSEUM GUIDE</text>
</svg>
